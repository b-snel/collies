# Every test, in 4 shards (tools/test.mjs --shard), on each PR to main and each push to main. Logs of a failed shard: its artifact.
name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium
      - name: Playwright, a PeerJS server
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 peer@1.0.2
          npx playwright install --with-deps chromium
      - name: PeerJS server (the online tests)
        run: nohup npx peerjs --port 9000 > peer.log 2>&1 &
      - name: Tests
        env:
          PEERSERVER: 127.0.0.1:9000
        run: node tools/test.mjs --all --shard ${{ matrix.shard }}/4 --logs logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.shard }}
          path: |
            logs/
            peer.log
